name: citizen-lab
x-api: &api
  image: citizen-api:local
  build: .
  restart: unless-stopped
  environment: &api-env
    DB_HOST: postgres
    DB_NAME: shop
    DB_USER: shop
    DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - citizen-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U shop -d shop]
      interval: 5s
      timeout: 3s
      retries: 20
  member-api:
    <<: *api
    environment:
      <<: *api-env
      SERVICE_NAME: member
  payment-api:
    <<: *api
    environment:
      <<: *api-env
      SERVICE_NAME: payment
  order-api:
    <<: *api
    environment:
      <<: *api-env
      SERVICE_NAME: order
  gateway:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [member-api, payment-api, order-api]
volumes:
  citizen-db:
