name: test-build-deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citizen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL and three Java APIs
        run: |
          cp .env.example .env
          docker compose up -d --build
          ready=false
          for i in $(seq 1 90); do
            member_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/members/me || true)
            order_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/orders || true)
            payment_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/payments/probe || true)
            if [ "$member_code" = 401 ] && [ "$order_code" = 401 ] && [ "$payment_code" = 401 ]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.api }}
      web: ${{ steps.image.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        shell: bash
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.api }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile.ingress
          push: true
          tags: ${{ steps.image.outputs.web }}
  deploy:
    if: vars.ENABLE_DEPLOY == 'true'
    needs: build
    runs-on: [self-hosted, linux, x64, shop-lab]
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      WEB_IMAGE: ${{ needs.build.outputs.web }}
      KUBECONFIG: /home/runner/.kube/config
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh
