apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: github-deployer
    namespace: shop
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: github-deployer
    namespace: shop
  rules:
  - apiGroups:
    - apps
    resources:
    - deployments
    resourceNames:
    - member-api
    - payment-api
    - order-api
    - gateway
    verbs:
    - get
    - list
    - patch
    - watch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: github-deployer
    namespace: shop
  subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: shop
  roleRef:
    kind: Role
    name: github-deployer
    apiGroup: rbac.authorization.k8s.io
