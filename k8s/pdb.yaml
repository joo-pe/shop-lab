apiVersion: v1
kind: List
items:
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata:
    name: member-api
    namespace: shop
  spec:
    minAvailable: 1
    selector:
      matchLabels:
        app: member-api
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata:
    name: payment-api
    namespace: shop
  spec:
    minAvailable: 1
    selector:
      matchLabels:
        app: payment-api
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata:
    name: order-api
    namespace: shop
  spec:
    minAvailable: 1
    selector:
      matchLabels:
        app: order-api
