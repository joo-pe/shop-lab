apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Service
  metadata:
    name: postgres
    namespace: shop
  spec:
    selector:
      app: postgres
    ports:
    - name: db
      port: 5432
      targetPort: 5432
- apiVersion: v1
  kind: Service
  metadata:
    name: postgres-headless
    namespace: shop
  spec:
    selector:
      app: postgres
    ports:
    - name: db
      port: 5432
      targetPort: 5432
    clusterIP: None
- apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    name: postgres
    namespace: shop
  spec:
    serviceName: postgres-headless
    replicas: 1
    selector:
      matchLabels:
        app: postgres
    template:
      metadata:
        labels:
          app: postgres
      spec:
        containers:
        - name: postgres
          image: postgres:17
          env:
          - name: POSTGRES_DB
            value: shop
          - name: POSTGRES_USER
            value: shop
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
          ports:
          - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - pg_isready -U shop -d shop
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data
        nodeSelector:
          kubernetes.io/hostname: k3s-worker2
    volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
