apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Service
  metadata:
    name: gateway
    namespace: shop
  spec:
    selector:
      app: gateway
    ports:
    - name: http
      port: 80
      targetPort: 8080
    type: ClusterIP
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: gateway
    namespace: shop
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: gateway
    template:
      metadata:
        labels:
          app: gateway
      spec:
        containers:
        - name: nginx
          image: WEB_IMAGE_PLACEHOLDER
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
        imagePullSecrets:
        - name: ghcr-pull
        nodeSelector:
          lab-role: worker
